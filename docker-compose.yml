services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cargoflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - cargoflow-sqlserver-data:/var/opt/mssql

volumes:
  cargoflow-sqlserver-data: